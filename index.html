<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whack-a-Something</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee}main{max-width:720px;margin:auto;padding:20px}h1{text-align:center}
button,input{font:inherit;border-radius:10px;border:1px solid #555;padding:10px}button{background:#242424;color:#fff}input{background:#181818;color:#fff;width:100%;margin:5px 0 10px}.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.center{text-align:center}.big{font-size:2rem;font-weight:700}#gameImage{display:block;max-width:100%;max-height:48vh;margin:15px auto;border-radius:14px}.timer{font-size:2.2rem;font-weight:800}.small{opacity:.7;font-size:.9rem}
</style>
</head>
<body><main>
<h1>Whack-a-Something</h1>
<section id="home" class="card"><h2>Your packs</h2><div id="packs"></div>
<div class="row"><button onclick="show('create')">＋ Create pack</button><button onclick="exportData()">Export backup</button><button onclick="document.getElementById('importFile').click()">Import backup</button></div>
<input id="importFile" type="file" accept=".json" hidden><p class="small">Packs are saved on this device/browser.</p></section>
<section id="create" class="card hidden"><h2>Create pack</h2><input id="packName" placeholder="Pack name"><div id="items"></div>
<div class="row"><button onclick="addItem()">＋ Add item</button><button onclick="savePack()">Save pack</button><button onclick="show('home')">Cancel</button></div></section>
<section id="game" class="card hidden center"><div class="row"><div>Score: <b id="score">0</b></div><div>Streak: <b id="streak">0</b></div><div class="timer" id="timer">12</div></div>
<img id="gameImage" alt="Item"><div id="prompt" class="big"></div><input id="answer" autocomplete="off" spellcheck="false" placeholder="Type the full name"><button onclick="quitGame()">Quit</button><p id="feedback"></p></section>
</main>
<script>
const DB='was-v2',STORE='packs';let db,currentPack,gameItems=[],currentIndex=0,score=0,streak=0,time,timerId,editingId=null;
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='home')renderPacks()}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}
function allPacks(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putPack(p){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(p);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delPack(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function renderPacks(){let box=document.getElementById('packs'),packs=await allPacks();box.innerHTML=packs.length?'':'<p class="small">No packs yet.</p>';packs.forEach(p=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+esc(p.name)+'</b><div class="small">'+p.items.length+' item(s)</div>';let r=document.createElement('div');r.className='row';let b=document.createElement('button');b.textContent='Play';b.onclick=()=>startGame(p);let e=document.createElement('button');e.textContent='Edit';e.onclick=()=>editPack(p);let x=document.createElement('button');x.textContent='Delete';x.onclick=async()=>{if(confirm('Delete this pack?')){await delPack(p.id);renderPacks()}};r.append(b,e,x);d.append(r);box.append(d)})}
function addItem(data={name:'',image:''}){let w=document.createElement('div');w.className='card itemEditor';w.innerHTML='<input class="itemName" placeholder="Name to type"><input class="itemFile" type="file" accept="image/*"><div class="preview small"></div><button type="button" class="remove">Remove</button>';w.querySelector('.itemName').value=data.name;w.dataset.image=data.image||'';w.querySelector('.preview').textContent=data.image?'Existing image selected':'';w.querySelector('.remove').onclick=()=>w.remove();w.querySelector('.itemFile').onchange=async e=>{if(e.target.files[0]){w.dataset.image=await resizeImage(e.target.files[0]);w.querySelector('.preview').textContent='Image selected'}};document.getElementById('items').append(w)}
function resizeImage(file){return new Promise(res=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}
function editPack(p){editingId=p.id;document.getElementById('packName').value=p.name;document.getElementById('items').innerHTML='';p.items.forEach(addItem);show('create')}
async function savePack(){let name=document.getElementById('packName').value.trim(),els=[...document.querySelectorAll('.itemEditor')],items=els.map(e=>({name:e.querySelector('.itemName').value.trim(),image:e.dataset.image||''})).filter(x=>x.name);if(!name||!items.length){alert('Add a pack name and at least one item.');return}await putPack({id:editingId||undefined,name,items});editingId=null;document.getElementById('packName').value='';document.getElementById('items').innerHTML='';show('home')}
function startGame(p){if(!p.items.length)return;currentPack=p;gameItems=[...p.items].sort(()=>Math.random()-.5);currentIndex=0;score=0;streak=0;document.getElementById('score').textContent=0;document.getElementById('streak').textContent=0;show('game');nextRound()}
function nextRound(){clearInterval(timerId);if(currentIndex>=gameItems.length){gameItems=[...currentPack.items].sort(()=>Math.random()-.5);currentIndex=0}let it=gameItems[currentIndex++];document.getElementById('gameImage').src=it.image||'';document.getElementById('gameImage').style.display=it.image?'block':'none';document.getElementById('prompt').textContent=it.name;document.getElementById('feedback').textContent='';let a=document.getElementById('answer');a.value='';a.focus();time=12;document.getElementById('timer').textContent=12;timerId=setInterval(()=>{time--;document.getElementById('timer').textContent=time;if(time<=0){clearInterval(timerId);streak=0;document.getElementById('feedback').textContent='Time!';setTimeout(nextRound,500)}},1000)}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key!=='Enter')return;let target=document.getElementById('prompt').textContent.trim().toLowerCase(),got=e.target.value.trim().toLowerCase();if(got===target){clearInterval(timerId);score++;streak++;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('feedback').textContent='✓ Correct!';setTimeout(nextRound,300)}else document.getElementById('feedback').textContent='Try again!'})
function quitGame(){clearInterval(timerId);show('home')}
async function exportData(){let data=await allPacks(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='whack-a-something-backup.json';a.click()}
document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{for(let p of JSON.parse(r.result))await putPack({name:p.name,items:p.items});alert('Backup imported!');renderPacks()}catch(x){alert('Invalid backup.')}};r.readAsText(f)}
openDB().then(renderPacks).catch(e=>alert('Storage error: '+e));
</script></body></html>
